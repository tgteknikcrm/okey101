<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Replaced by the --base-href argument passed to `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Okey 101 - Yuzbir Okey, uc bota karsi. Tarayicida calisan, kurulabilir oyun.">

  <!--
    Dragging 21 tiles in a mobile browser breaks by default. user-scalable=no
    plus viewport-fit=cover kills double-tap-to-zoom and lets the board reach
    under the iPhone notch; the CSS below handles the rest.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS reads these and ignores the manifest's icons entirely. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okey 101">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <meta name="theme-color" content="#0F3D2E">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Okey 101</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      None of this is solvable from Dart. Without it a downward drag on the
      rack fires pull-to-refresh, a long press selects text and opens the
      context menu, and iOS Safari rubber-bands the whole page.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      background-color: #0F3D2E;
      touch-action: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    flt-glass-pane, flutter-view, #flutter_root {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Plain HTML/CSS, rendered before Flutter boots. CanvasKit is ~1.5 MB. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 35%, #1B5E43 0%, #0F3D2E 70%);
      color: #F4ECD8;
      z-index: 9999;
      transition: opacity 260ms ease-out;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading .tile {
      width: 74px;
      height: 100px;
      border-radius: 12px;
      background: linear-gradient(160deg, #FBF5E6 0%, #E8DCC0 100%);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), inset 0 -4px 0 rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 700;
      color: #C62828;
      animation: tilt 1.6s ease-in-out infinite;
    }

    @keyframes tilt {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50%      { transform: rotate(6deg) translateY(-10px); }
    }

    #loading .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.92;
    }

    #loading .bar {
      width: 168px;
      height: 4px;
      border-radius: 2px;
      background: rgba(244, 236, 216, 0.22);
      overflow: hidden;
    }

    #loading .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #F4ECD8;
      animation: slide 1.25s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    #loading .hint {
      font-size: 13px;
      opacity: 0.6;
      max-width: 260px;
      text-align: center;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .tile, #loading .bar span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="tile">101</div>
    <div class="title">Okey 101</div>
    <div class="bar"><span></span></div>
    <div class="hint">Oyun yukleniyor...</div>
  </div>

  <script>
    (function () {
      var removed = false;
      function hideLoading() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('loading');
        if (!el) return;
        el.classList.add('hidden');
        window.setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 300);
      }

      // The SDK dispatches this on `window`; listening on `document` too costs
      // nothing and covers older/newer engine behaviour.
      window.addEventListener('flutter-first-frame', hideLoading);
      document.addEventListener('flutter-first-frame', hideLoading);

      // A missed event must never leave the user staring at a spinner.
      window.setTimeout(hideLoading, 20000);

      // Belt and braces on top of the CSS: cancel gestures the browser would
      // otherwise turn into zoom, selection or a context menu.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
