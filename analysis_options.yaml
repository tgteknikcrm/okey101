include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    # This is a single-package app with a deliberately large domain API; doc
    # comments on every public member would be noise, not information.
    public_member_api_docs: false
    lines_longer_than_80_chars: false

    # Freezed's own generated shape puts the private `const X._()` constructor
    # after the redirecting factories, and named "preset" builders read far
    # better as statics than as constructors on a freezed class.
    sort_constructors_first: false
    sort_unnamed_constructors_first: false
    prefer_constructors_over_static_methods: false
    always_put_required_named_parameters_first: false

    # A Riverpod Notifier mutator is idiomatically a method, not a setter.
    use_setters_to_change_properties: false

    # Style-only, and both fight readability in the engine's hot paths.
    join_return_with_assignment: false
    prefer_int_literals: false
    flutter_style_todos: false
    avoid_positional_boolean_parameters: false
    one_member_abstracts: false
